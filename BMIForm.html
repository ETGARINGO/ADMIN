<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="Video.gif">
    <link rel="apple-touch-icon" href="Video.gif">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PRO9 | BMI MONITORING FORM</title>
    <style>
        :root {
            --bg-black: #00050a;
            --tactical-blue: #00d4ff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-black);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Hardware Accelerated Ambient Background Video Layer */
        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0.15; /* Subdued subtle texture backdrop */
            pointer-events: none;
        }

        /* Top Bar Overlay to give it an official system look */
        .header-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #00d4ff, #00ff66);
            z-index: 10;
        }

        /* Clean Frame Layer */
        #secure-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 5;
            background: transparent; /* Allows subtle background details to breathe */
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header-strip"></div>

    <video id="bg-video" autoplay muted loop playsinline preload="auto">
        <source src="VIDM.mp4" type="video/mp4">
    </video>

    <iframe id="secure-frame" 
            src="https://script.google.com/macros/s/AKfycbzDHcnknm7ntxhZG1B1NlgKfmejSb2mfBsSnUiFs104EmjY5SoTROf8cjtSfJRkmyzFXg/exec" 
            allow="fullscreen; geolocation; camera; microphone;">
    </iframe>

    <script>
        // Production Keyboard Security Overrides
        document.onkeydown = function (e) {
            if (e.keyCode == 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || 
                (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        };
    </script>
</body>
</html>
