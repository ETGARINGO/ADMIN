<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PRO9 | BMI MONITORING INFORMATION SYSTEM</title>
    
    <link rel="icon" type="image/png" href="Video.gif">
    <link rel="apple-touch-icon" href="Video.gif">
    
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://server.arcgisonline.com">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --tactical-cyan: #00f0ff;       
            --matrix-green: #00ff41;        
            --alert-crimson: #ff0055;       
            --bg-deep-space: #01060f;       
            --kinetic-snap: cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: var(--bg-deep-space); 
            position: fixed; 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
        }

        /* VIDEO BACKGROUND PIPELINE */
        .video-matrix-bg {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            z-index: 1; 
            overflow: hidden; 
            background: var(--bg-deep-space);
            transform: translate3d(0, 0, 0); 
            backface-visibility: hidden;
        }
        
        .video-matrix-bg video {
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            filter: brightness(0.4) contrast(1.4) saturate(0.3) hue-rotate(190deg);
            transform: scale(1.02);
            will-change: transform, filter;
            transition: filter 0.6s var(--kinetic-snap);
        }

        body.matrix-active .video-matrix-bg video {
            filter: brightness(0.85) contrast(1.1) saturate(1.0) hue-rotate(0deg) !important;
        }

        /* GEOSPATIAL RADAR LAYER */
        #nav-map {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            z-index: 2; 
            mix-blend-mode: screen;
            background: transparent !important;
            will-change: opacity, filter;
            transform: translate3d(0,0,0);
            opacity: 0.85;
            transition: filter 0.6s var(--kinetic-snap), opacity 0.6s var(--kinetic-snap), mix-blend-mode 0.6s;
        }

        .leaflet-container { background: transparent !important; }
        
        .leaflet-tile-container img { 
            will-change: filter; 
            filter: brightness(0.3) contrast(1.7) saturate(0.05) hue-rotate(180deg) invert(0.05) !important;
            transition: filter 0.6s var(--kinetic-snap);
        }

        body.matrix-active .leaflet-tile-container img {
            filter: brightness(0.9) contrast(1.15) saturate(0.9) hue-rotate(0deg) invert(0) !important;
        }
        
        body.matrix-active #nav-map {
            mix-blend-mode: normal !important;
            opacity: 1.0 !important;
        }

        /* HEADS-UP DISPLAY OVERLAY */
        #hud {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            z-index: 10;
            background: radial-gradient(circle, rgba(1, 6, 15, 0.1) 20%, rgba(1, 6, 15, 0.95) 100%);
            transition: opacity 0.4s var(--kinetic-snap), visibility 0.4s;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            pointer-events: none;
            padding: 20px;
        }

        .hud-frame-box {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            padding: 40px 60px; 
            position: relative;
            transform: scale(0.85); 
            opacity: 0;
            animation: tacticalTargetLock 0.5s var(--kinetic-snap) forwards;
            max-width: 90vw;
            text-align: center;
        }

        .hud-frame-box::before, .hud-frame-box::after {
            content: ''; 
            position: absolute; 
            width: 45px; 
            height: 45px;
            border-color: var(--tactical-cyan); 
            border-style: solid;
            transition: all 0.3s var(--kinetic-snap);
            filter: drop-shadow(0 0 8px var(--tactical-cyan));
        }
        
        .hud-frame-box::before { top: 0; left: 0; border-width: 3px 0 0 3px; transform: translate(-5px, -5px); }
        .hud-frame-box::after { bottom: 0; right: 0; border-width: 0 3px 3px 0; transform: translate(5px, 5px); }

        .entrance-logo {
            width: 120px; 
            height: auto;
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.5));
            object-fit: contain;
        }

        .header-container {
            text-align: center; 
            color: #ffffff; 
            text-transform: uppercase;
            margin-top: 25px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 8px;
        }

        .header-container h1 { 
            margin: 0; 
            font-size: 1.6rem; 
            letter-spacing: 5px; 
            font-weight: 900; 
            text-shadow: 0 0 15px var(--tactical-cyan);
        }

        .header-container .system-title {
            font-size: 0.85rem; 
            letter-spacing: 3px; 
            color: var(--tactical-cyan); 
            font-weight: 700; 
            margin: 0;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        .header-container .system-status {
            font-size: 0.7rem; 
            letter-spacing: 2px; 
            color: var(--matrix-green); 
            font-family: monospace; 
            margin: 12px 0 0 0;
            background: rgba(0, 255, 65, 0.08); 
            padding: 4px 12px; 
            border-radius: 3px; 
            border: 1px solid rgba(0, 255, 65, 0.3);
            text-shadow: 0 0 4px rgba(0, 255, 65, 0.4);
            animation: pulse-text 0.8s infinite alternate ease-in-out;
        }

        @keyframes pulse-text {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* VECTOR MARKERS */
        .tactical-label {
            background: rgba(1, 6, 15, 0.95) !important; 
            border: 1px solid var(--tactical-cyan) !important;
            color: #ffffff !important; 
            font-weight: 700 !important; 
            font-family: monospace !important;
            font-size: 10px !important; 
            padding: 4px 8px !important; 
            border-radius: 2px !important;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3) !important; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }
        
        .hq-label {
            border-color: var(--alert-crimson) !important; 
            color: var(--alert-crimson) !important; 
            font-weight: 900 !important;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4) !important;
        }

        @keyframes pulseMatrix { 
            0% { transform: scale(0.4); opacity: 1; } 
            100% { transform: scale(2.2); opacity: 0; } 
        }
        
        .pulse-ring { border: 2px solid var(--matrix-green); border-radius: 50%; animation: pulseMatrix 1.2s infinite cubic-bezier(0.1, 0.8, 0.3, 1); filter: drop-shadow(0 0 4px var(--matrix-green)); }
        .hq-pulse-ring { border: 2px solid var(--alert-crimson); border-radius: 50%; animation: pulseMatrix 1.2s infinite cubic-bezier(0.1, 0.8, 0.3, 1); filter: drop-shadow(0 0 6px var(--alert-crimson)); }
        @keyframes tacticalTargetLock { to { transform: scale(1); opacity: 1; } }

        /* CORE APPLICATION IFRAME FRAME */
        #secure-frame {
            position: absolute; 
            width: 100%; 
            height: 100%; 
            border: none; 
            z-index: 5; 
            opacity: 0; 
            visibility: hidden; 
            transition: opacity 0.5s var(--kinetic-snap);
            background: transparent;
        }

        @media (max-width: 600px) {
            .header-container h1 { font-size: 1.2rem; letter-spacing: 3px; }
            .header-container .system-title { font-size: 0.75rem; letter-spacing: 2px; }
            .hud-frame-box { padding: 25px 20px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="video-matrix-bg">
        <video autoplay loop muted playsinline poster="LOGO.png">
            <source src="VIDM.mp4" type="video/mp4">
        </video>
    </div>

    <div id="nav-map"></div>

    <iframe id="secure-frame" 
            src="https://script.google.com/macros/s/AKfycbytKEPF1lfzRwhYit2BavD9NpL6ZiLmE3iRcEVE8TSL0RgL1e5sujTcOYD5niGQzMG4nQ/exec" 
            allow="geolocation; camera; microphone; fullscreen; autoplay; display-capture;">
    </iframe>

    <div id="hud">
        <div class="hud-frame-box">
            <img src="pro9 logo.png" alt="PRO9 Logo" class="entrance-logo" width="110" height="110">
            <div class="header-container">
                <h1>Police Regional Office 9</h1>
                <p class="system-title">Body Mass Index Monitoring System</p>
                <p class="system-status">// INITIATING SYSTEM MATRIX...</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const regionalNodes = [
          { n: "PRO9 HQ (CAMP ABENDAN)", p: [6.9576, 122.1444], isHQ: true },
          { n: "ZAMBOANGA CITY POLICE OFFICE", p: [6.9214, 122.0790], isHQ: false },
          { n: "SULU PROVINCIAL HQ", p: [6.0000, 121.0000], isHQ: false },
          { n: "ISABELA CITY DIVISION", p: [6.7042, 121.9711], isHQ: false },
          { n: "ZAMBOANGA SIBUGAY PROVINCIAL HQ", p: [7.7811, 122.7244], isHQ: false },
          { n: "ZAMBOANGA DEL SUR PROVINCIAL HQ", p: [7.8283, 123.4344], isHQ: false },
          { n: "ZAMBOANGA DEL NORTE PROVINCIAL HQ", p: [8.2003, 123.0012], isHQ: false }
        ];

        // Map initialization
        const map = L.map('nav-map', { 
            zoomControl: false, 
            attributionControl: false, 
            zoomAnimation: true,
            markerZoomAnimation: true,
            preferCanvas: true 
        }).setView([7.4000, 122.3000], 7);
        
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            updateWhenIdle: false,
            keepBuffer: 3
        }).addTo(map);

        // Plot tactical nodes
        regionalNodes.forEach(node => {
            const markerColor = node.isHQ ? '#ff0055' : '#00f0ff';
            const pulseClassName = node.isHQ ? 'hq-pulse-ring' : 'pulse-ring';
            const tooltipClassName = node.isHQ ? 'tactical-label hq-label' : 'tactical-label';

            L.circleMarker(node.p, { radius: node.isHQ ? 7 : 5, color: '#fff', fillColor: markerColor, fillOpacity: 1, weight: 2 }).addTo(map)
             .bindTooltip(node.n, { permanent: true, direction: 'right', offset: [14, 0], className: tooltipClassName });
            
            L.circleMarker(node.p, { radius: node.isHQ ? 24 : 16, color: markerColor, weight: 1.5, fillOpacity: 0, className: pulseClassName }).addTo(map);
        });

        // Orchestrated UI sequence timeline
        window.addEventListener('DOMContentLoaded', () => {
            // Step 1: Initial quick target pan
            setTimeout(() => {
                map.flyTo([6.9576, 122.1444], 13, { duration: 0.5, easeLinearity: 0.1 });
            }, 100);

            // Step 2: Recalibrate map perspective and reveal target app layout
            setTimeout(() => {
                document.body.classList.add('matrix-active');
                map.flyTo([7.4000, 122.3000], 8, { duration: 0.6, easeLinearity: 0.1 });
                
                setTimeout(() => {
                    const frame = document.getElementById('secure-frame');
                    const hud = document.getElementById('hud');
                    
                    frame.style.visibility = "visible";
                    frame.style.opacity = "0.94"; 
                    hud.style.opacity = "0";
                    hud.style.visibility = "hidden";
                }, 250); 
            }, 1050);
        });

        // Modern Security Input Sanitization
        window.addEventListener('keydown', (e) => {
            const forbiddenKeys = ['F12', 'u', 's', 'i', 'j', 'c'];
            if (
                e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && forbiddenKeys.includes(e.key.toLowerCase())) || 
                (e.ctrlKey && forbiddenKeys.includes(e.key.toLowerCase()))
            ) {
                e.preventDefault();
            }
        });

        // Idle Terminal Heartbeat Reloader
        let terminalIdleTime = 0;
        const flushIdleTimer = () => terminalIdleTime = 0;
        ['mousemove', 'keypress', 'touchstart'].forEach(evt => window.addEventListener(evt, flushIdleTimer, { passive: true }));

        setInterval(() => {
            terminalIdleTime++;
            if (terminalIdleTime >= 30) window.location.reload();
        }, 60000);
    </script>
</body>
</html>
