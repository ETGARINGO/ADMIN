<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PNP-PRO9 Personnel Satisfaction Survey</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,600;1,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #001a33; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #00264d 0%, #001a33 100%);
            z-index: 999; padding: 40px; color: #e0e0e0; cursor: pointer;
        }

        .brand-logo { width: 150px; margin-bottom: 25px; filter: drop-shadow(0 0 10px rgba(212,175,55,0.5)); }

        #typing-text {
            max-width: 700px; font-family: 'Crimson Text', serif;
            font-size: 1.5rem; line-height: 1.8; color: #fff;
            text-align: center; border-left: 3px solid #d4af37; padding-left: 20px;
        }

        #proceed-btn {
            margin-top: 40px; padding: 15px 50px;
            background: transparent; color: #d4af37;
            border: 2px solid #d4af37; border-radius: 4px;
            cursor: pointer; font-weight: bold; font-size: 1.1rem;
            text-transform: uppercase; letter-spacing: 2px;
            display: none; transition: 0.4s;
        }

        #proceed-btn:hover { background: #d4af37; color: #001a33; }
        
        .main-container { height: 100vh; width: 100vw; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="loader" onclick="startExperience()">
        <img src="https://github.com/ETGARINGO/ADMIN/blob/main/pgslogo.png?raw=true" alt="Logo" class="brand-logo">
        <div id="typing-text"> Please answer honestly...</div>
        <button id="proceed-btn" onclick="startSurvey(event)">PROCEED TO SURVEY</button>
    </div>

    <div class="main-container" id="survey-ui">
        <iframe src="https://script.google.com/macros/s/AKfycbyaPAqSQDt6r3ELReWVKmtMIXfjfMQ5cM4r5QaEbCGJAblvrYNLAV0dYO9HHDocBMDV/exec"></iframe>
    </div>

    <script>
        const message = "Dear Respondents, The Personnel Satisfaction Survey (PSS) is a key feedback mechanism for the PNP to assess the issues and concerns of both Uniformed and Non-Uniformed Personnel. Your results will help top management address these concerns effectively. Your participation is critical — findings will serve as the basis for programs, policy amendments, and strategic direction. Please answer honestly. Responses are strictly confidential.";
        const typeEl = document.getElementById("typing-text");
        const btn = document.getElementById("proceed-btn");
        let hasStarted = false;

        async function startExperience() {
            if (hasStarted) return;
            hasStarted = true;
            typeEl.innerHTML = ""; // Clear the "Click to begin" text

            // 1. Start Speech
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.rate = 0.9;
            utterance.pitch = 0.8;
            window.speechSynthesis.speak(utterance);

            // 2. Start Typing Effect
            let i = 0;
            function type() {
                if (i < message.length) {
                    typeEl.innerHTML += message.charAt(i);
                    i++;
                    setTimeout(type, 40);
                } else {
                    btn.style.display = "block";
                }
            }
            type();
        }

        function startSurvey(event) {
            event.stopPropagation(); // Prevent triggering the loader click again
            window.speechSynthesis.cancel();
            document.getElementById('loader').style.display = 'none';
            document.getElementById('survey-ui').style.display = 'block';
        }
    </script>
</body>
</html>
