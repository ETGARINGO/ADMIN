<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Link Preview Meta Tags: Essential for Messenger/Viber visibility -->
    <title>PNP-PRO9 Personnel Satisfaction Survey</title>
    <meta property="og:title" content="PNP-PRO9 Personnel Satisfaction Survey">
    <meta property="og:description" content="Official Personnel Satisfaction Survey Portal">
    <!-- Using ?raw=true ensures the logo renders in external apps -->
    <meta property="og:image" content="https://github.com/ETGARINGO/ADMIN/blob/main/pgslogo.png?raw=true">
    <meta property="og:url" content="https://admin.rprmd9.site/PGS">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" href="https://github.com/ETGARINGO/ADMIN/blob/main/pgslogo.png?raw=true">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #003366; }
        
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #ffffff; z-index: 999;
        }

        .brand-logo {
            width: 120px; height: 120px;
            animation: pulse 2s infinite ease-in-out;
            margin-bottom: 20px;
            cursor: pointer;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .main-container { height: 100vh; width: 100vw; position: relative; }
        
        .fs-toggle {
            position: absolute; top: 20px; right: 20px; z-index: 100;
            background: rgba(0, 51, 102, 0.9); color: #d4af37;
            border: 2px solid #d4af37; padding: 12px; border-radius: 50%;
            cursor: pointer; backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="loader">
        <a href="https://admin.rprmd9.site/PGS" target="_blank">
            <img src="https://github.com/ETGARINGO/ADMIN/blob/main/pgslogo.png?raw=true" alt="Logo" class="brand-logo">
        </a>
        <div style="color: #003366; font-family: sans-serif; font-weight: bold; letter-spacing: 1px;">PLEASE ANSWER HONESTLY...</div>
    </div>

    <div class="main-container" id="fullscreen-target">
        <button class="fs-toggle" onclick="toggleFullscreen()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </button>
        <iframe 
            src="https://script.google.com/macros/s/AKfycbyaPAqSQDt6r3ELReWVKmtMIXfjfMQ5cM4r5QaEbCGJAblvrYNLAV0dYO9HHDocBMDV/exec"
            onload="document.getElementById('loader').style.display='none'">
        </iframe>
    </div>

    <script>
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.getElementById("fullscreen-target").requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
