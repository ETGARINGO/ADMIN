<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>PNP-PRO9 Personnel Satisfaction Survey</title>
    <meta property="og:title" content="PNP-PRO9 Personnel Satisfaction Survey">
    <meta property="og:description" content="Official Personnel Satisfaction Survey Portal">
    <meta property="og:image" content="https://yourdomain.com/pgslogo.png"> <meta property="og:type" content="website">
    
    <link rel="icon" type="image/png" href="pgslogo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #003366; }
        
        /* Loading Spinner */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: #f4f4f4; z-index: 999;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #d4af37; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .main-container { height: 100vh; position: relative; }
        
        .fs-toggle {
            position: absolute; top: 15px; right: 15px; z-index: 100;
            cursor: pointer; background: rgba(0, 51, 102, 0.9);
            color: #d4af37; border: 1px solid #d4af37; padding: 10px;
            border-radius: 8px; backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .fs-toggle:hover { background: #d4af37; color: #003366; }

        .sheet-container { height: 100%; width: 100%; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <div class="main-container" id="fullscreen-target">
        <button class="fs-toggle" onclick="toggleFullscreen()" title="Toggle Fullscreen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        </button>

        <div class="sheet-container">
            <iframe 
                src="https://script.google.com/macros/s/AKfycbyaPAqSQDt6r3ELReWVKmtMIXfjfMQ5cM4r5QaEbCGJAblvrYNLAV0dYO9HHDocBMDV/exec"
                onload="document.getElementById('loader').style.display='none'"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        function toggleFullscreen() {
            const elem = document.getElementById("fullscreen-target");
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(e => console.log(e));
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
