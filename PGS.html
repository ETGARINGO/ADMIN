<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Meta tags for social sharing -->
    <title>PNP-PRO9 Personnel Satisfaction Survey</title>
    <meta property="og:title" content="PNP-PRO9 Personnel Satisfaction Survey">
    <meta property="og:description" content="Official Personnel Satisfaction Survey Portal">
    <!-- IMPORTANT: Use a full, absolute URL for your logo below -->
    <meta property="og:image" content="https://yourdomain.com/pgslogo.png">
    
    <link rel="icon" type="image/png" href="pgslogo.png">
    
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #003366; }
        
        /* Animated Loader Overlay */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #ffffff; z-index: 999;
        }

        /* Animated Logo Pulse */
        .brand-logo {
            width: 120px; height: 120px;
            animation: pulse 2s infinite ease-in-out;
            margin-bottom: 20px;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .main-container { height: 100vh; position: relative; }
        .fs-toggle {
            position: absolute; top: 15px; right: 15px; z-index: 100;
            background: rgba(0, 51, 102, 0.8); color: #d4af37; border: 1px solid #d4af37;
            padding: 10px; border-radius: 8px; cursor: pointer; backdrop-filter: blur(5px);
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="loader">
        <!-- REPLACE 'pgslogo.png' with the actual path to your image -->
        <img src="pgslogo.png" alt="Logo" class="brand-logo">
        <div style="color: #003366; font-family: sans-serif; font-weight: bold;">LOADING SURVEY...</div>
    </div>

    <div class="main-container" id="fullscreen-target">
        <button class="fs-toggle" onclick="toggleFullscreen()">FULLSCREEN</button>
        <iframe 
            src="https://script.google.com/macros/s/AKfycbyaPAqSQDt6r3ELReWVKmtMIXfjfMQ5cM4r5QaEbCGJAblvrYNLAV0dYO9HHDocBMDV/exec"
            onload="document.getElementById('loader').style.display='none'">
        </iframe>
    </div>

    <script>
        function toggleFullscreen() {
            const elem = document.getElementById("fullscreen-target");
            if (!document.fullscreenElement) elem.requestFullscreen();
            else document.exitFullscreen();
        }
    </script>
</body>
</html>
