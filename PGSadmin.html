<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Access</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: #001a33; font-family: sans-serif;
        }

        /* LOGIN OVERLAY */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #001a33; z-index: 1000; color: white;
        }

        /* LOGO STYLING */
        .logo { width: 150px; margin-bottom: 20px; border-radius: 8px; }

        input[type="password"] {
            padding: 12px; margin: 15px; border-radius: 4px; border: 2px solid #d4af37;
            background: rgba(255,255,255,0.1); color: white; text-align: center;
        }

        button {
            padding: 10px 25px; background: #d4af37; border: none; 
            border-radius: 4px; cursor: pointer; font-weight: bold;
        }

        /* IFRAME CONTAINER */
        .iframe-container { width: 100%; height: 100vh; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- AUTHENTICATION OVERLAY -->
    <div id="auth-overlay">
        <!-- ADDED LOGO -->
        <img src="Video.gif" alt="Portal Logo" class="logo">
        
        <h2>Enter Admin Passkey</h2>
        <input type="password" id="passkey" placeholder="Enter Passkey">
        <button onclick="checkAccess()">ACCESS PORTAL</button>
        <p id="error" style="color: red; display: none; margin-top: 10px;">Invalid Passkey</p>
    </div>

    <!-- PROTECTED CONTENT -->
    <div class="iframe-container" id="protected-content">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbz_Yb6HeYRICbBflFDznHHPerYsMi97i19uWcmD1EF1-QcZsopM3FIanjSaEAVMrH1k/exec?page=admin" 
            title="Admin Portal"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        function checkAccess() {
            const pass = document.getElementById("passkey").value;
            if (pass === "Admin101") {
                document.getElementById("auth-overlay").style.display = "none";
                document.getElementById("protected-content").style.display = "block";
            } else {
                document.getElementById("error").style.display = "block";
            }
        }

        document.getElementById("passkey").addEventListener("keypress", function(event) {
            if (event.key === "Enter") checkAccess();
        });
    </script>

</body>
</html>
